<style>
/* Layout : barre latérale fixe + zone de travail ; cartes blanches sur fond bleuté clair. Thème clair unique (choix). */
:root{
  color-scheme:light;
  --bleu:#0B5ED7; --bleu-fonce:#0a3a82; --bleu-pale:#e7f0fd;
  --vert:#198754; --vert-pale:#e3f4ec;

}
*{box-sizing:border-box}

.app{display:grid;grid-template-columns:236px 1fr;height:100%}

.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:#fff;color:var(--bleu-fonce);font-weight:600}

.tw{overflow-x:auto}

.toast.err{background:var(--crit)} .toast.ok{background:var(--vert)}
dl.fiche{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0}
dl.fiche div{display:flex;flex-direction:column} dl.fiche dt{font-size:12px;color:var(--gris)} dl.fiche dd{margin:0;font-weight:600}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--bleu-pale);color:var(--bleu-fonce);display:grid;place-items:center;font:700 22px var(--f-titre);flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--bord)}
.top input{width:100%;max-width:620px;font-size:16px;padding:11px 16px;border-radius:26px;border:1px solid var(--bord);background:#fff}
textarea{width:100%}
.card h3,.modal h3{margin:12px 0 4px}

.snum{width:22px;height:22px;border-radius:50%;background:var(--bleu);color:#fff;display:inline-grid;place-items:center;font-size:12px;flex:none}
.ajout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr) minmax(0,.9fr) minmax(0,.55fr) minmax(0,.8fr) auto;gap:10px;align-items:end}

.p-titre{background:#e7f0fd;color:#0a3a82;font-weight:800;text-align:center;padding:6px;border-radius:4px;letter-spacing:.02em}
.p-blocs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.p-blocs>div{border:1px solid var(--bord);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}

.p-sign{display:flex;justify-content:space-around;gap:10px;font-weight:700;font-size:12px;text-align:center;padding:6px 0 26px}

.lp td{white-space:nowrap}.lp td:first-child{white-space:normal}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{flex-direction:row;align-items:center;padding:8px 10px;gap:8px;overflow-x:auto}
  .brand small,.who span{display:none}
  .nav{flex-direction:row}
  .nav button span.l{display:none} .nav button.on span.l{display:inline}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.cl-ecran{position:fixed;inset:0;background:var(--fond);display:grid;place-items:center;z-index:60;padding:16px;overflow:auto}.cl-box{width:100%;max-width:440px}.cl-etat{font-size:12px;padding:4px 8px;border-radius:8px;background:#0d2f55}.cl-etat:before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#9fb3c8}.cl-etat.ok:before{background:#3ccf8e}.cl-etat.info:before{background:#6fb1ff}.cl-etat.warn:before{background:#f2a93b}.cl-etat.crit:before{background:#ff6b6b}

/* Borne : horloge, calendrier et cadran */

.horoLab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gris)}

.seg2{display:flex;background:var(--mute);border-radius:12px;padding:3px;gap:3px}.seg2 button{flex:1;font:inherit;font-weight:700;font-size:14px;border:0;background:transparent;padding:9px;border-radius:9px;cursor:pointer;color:var(--gris)}.seg2 button.on{background:var(--carte);color:var(--bleu);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.cal{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:10px}.calHd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.calHd b{text-transform:capitalize}

.cj{font:inherit;font-size:13px;height:34px;border-radius:9px;border:0;background:var(--mute);cursor:pointer;color:var(--encre)}.cj:disabled{background:transparent;color:#b8c3cf;cursor:default}.cj.auj{box-shadow:inset 0 0 0 2px var(--bleu)}.cj.on{background:var(--bleu);color:#fff}
.cadranBox{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:10px}

.kiosk .horo input{letter-spacing:0}.kiosk:has(.horoPick){max-width:780px}.recap .horoPick{grid-template-columns:1fr}@media (min-width:700px){.recap .horoPick{grid-template-columns:1fr 1fr}}

.kItem:hover,.kItem:focus-visible{border-color:var(--bleu);background:var(--bleu-pale)}.kItem .avatar{width:38px;height:38px;font-size:13px;flex:none}

<body>
<div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
/* ============ Utilitaires ============ */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const at=(k,hm)=>new Date(`${k}T${hm}:00`);
const addDays=(k,n)=>{const d=at(k,'12:00');d.setDate(d.getDate()+n);return dkey(d)};
const hm=iso=>iso?(d=>pad(d.getHours())+':'+pad(d.getMinutes()))(new Date(iso)):'—';
const fdate=k=>at(k,'12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'short'});
const fdt=iso=>iso?new Date(iso).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const dur=m=>m==null?'—':`${Math.floor(m/60)} h ${pad(Math.round(m%60))}`;
const uid=()=>Date.now().toString(36).slice(-6)+Math.random().toString(36).slice(2,8);
const today=()=>dkey(new Date());
const dfr=k=>k?k.slice(8,10)+'/'+k.slice(5,7)+'/'+k.slice(0,4):'—';
function anciennete(d1,d2){const a=at(d1,'12:00'),b=at(d2||today(),'12:00');if(b<a)return'—';
 const tm=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()-(b.getDate()<a.getDate()?1:0),dim=new Date(a.getFullYear(),a.getMonth()+tm+1,0).getDate();
 const anc=new Date(a.getFullYear(),a.getMonth()+tm,Math.min(a.getDate(),dim),12),d=Math.max(0,Math.round((b-anc)/864e5)),y=Math.floor(tm/12),m=tm%12;
 const p=[];if(y)p.push(y+(y>1?' ans':' an'));if(m)p.push(m+' mois');if(d||!p.length)p.push(d+(d>1?' jours':' jour'));return p.join(' ')}
const addYears=(k,n)=>{const d=at(k,'12:00');d.setFullYear(d.getFullYear()+n);return dkey(d)};
const diffJ=(a,b)=>Math.round((at(b,'12:00')-at(a,'12:00'))/864e5);
function periodeRef(a){const T=today(),e=a.entree||T;let n=+T.slice(0,4)-+e.slice(0,4);if(addYears(e,n)>T)n--;return n<1?{du:e,au:addYears(e,1)}:{du:addYears(e,n-1),au:addYears(e,n)}}
const monday=k=>{const d=at(k,'12:00');return addDays(k,-((d.getDay()+6)%7))};

/* ============ Données ============ */
let KEY='pointview.v1';
let DB=null,PIX=new Map();
const VAC_DEF=[
 {code:'J',nom:'Jour',debut:'08:00',fin:'16:00',travail:true,pause:0},

 }

 const barre=`<div class="card"><div class="form"><label class="field">Service<select id="pl_svc" data-chg="plF" data-k="svc">${sc.length>1?`<option value="all"${F.svc==='all'?' selected':''}>Tous les services</option>`:''}${opt(DB.services.filter(x=>sc.includes(x.id)),F.svc,x=>[x.id,x.nom])}</select></label>
  <label class="field">Agent${agPick('pl_ag',base,F.agent,'data-chg="plAgent"','Tous — ou matricule, nom, téléphone')}</label>
  <label class="field">Poste<select id="pl_poste" data-chg="plF" data-k="poste"><option value="">Tous les postes</option>${opt(DB.fonctions,F.poste,f=>[f.id,f.nom])}</select></label>
  <label class="field">Type d'horaire<select id="pl_type" data-chg="plF" data-k="type"><option value="">Tous les types</option>${opt(vs,F.type,v=>[v.code,v.code+' · '+v.nom])}</select></label>
  <label class="field">Date<input type="date" id="pl_date" data-chg="plDate" value="${F.vue==='jour'?F.date:S.week}"></label>
  <div class="field"><span>Affichage</span><div class="row" style="flex-wrap:nowrap"><button class="btn ${F.vue==='semaine'?'':'g'}" data-act="plVue" data-v="semaine">Semaine</button><button class="btn ${F.vue==='jour'?'':'g'}" data-act="plVue" data-v="jour">Jour</button></div></div></div>
  <div class="row" style="margin-top:10px"><button class="btn g s" data-act="plNav" data-n="-1">← ${F.vue==='jour'?'Jour précédent':'Semaine précédente'}</button><button class="btn g s" data-act="plNav" data-n="0">Aujourd'hui</button><button class="btn g s" data-act="plNav" data-n="1">${F.vue==='jour'?'Jour suivant':'Semaine suivante'} →</button>${filtre?'<button class="btn g s" data-act="plReset">Effacer les filtres</button>':''}</div></div>`;
 const legende=`<div class="row sub" style="margin-top:12px">${vs.map(v=>`<span><span class="vc v${vk(v.code)}">${esc(v.code)}</span> ${esc(v.nom)}${v.travail&&v.debut?` ${v.debut}–${v.fin}`:''}</span>`).join('')}</div><div class="sub" style="margin-top:8px">${ed?'Choisissez la vacation dans chaque case, ou utilisez « Programmer en série ». Les jours passés ne sont plus modifiables. Un agent en repos, en congé ou non programmé n\'est jamais compté absent.':'Consultation seule pour votre profil.'}</div>`;
 let corps;
 if(F.vue==='jour'){const d=F.date,rows=as.map(a=>({a,r:etat(a.id,d),c:code(a,d)})).sort((x,y)=>((ordre.indexOf(x.c)+1)||99)-((ordre.indexOf(y.c)+1)||99)||x.a.nom.localeCompare(y.a.nom));
  corps=`<div class="row" style="margin-bottom:12px">${vs.map(v=>{const n=rows.filter(x=>x.c===v.code).length;return n?`<span class="pill mute"><span class="vc v${vk(v.code)}">${esc(v.code)}</span> ${esc(v.nom)} : <b>${n}</b></span>`:''}).join('')}</div>${table(['Agent','Service','Type d\'horaire','Horaire prévu','Situation du jour'],rows.map(({a,r})=>`<tr><td>${ident(a)}</td><td>${esc(svc(a.serviceId).nom)}</td><td>${cell(a,d)}</td><td>${r.s?hm(r.s)+' – '+hm(r.e):'—'}</td><td>${pill(r.statut)}</td></tr>`),'Aucun agent ne correspond à ces critères.')}`}
 else corps=table(['Agent',...days.map(d=>`<span style="${d===T?'color:var(--bleu);':''}">${fdate(d)}</span>`)],as.length?[...as.map(a=>`<tr><td>${ident(a)}</td>${days.map(d=>`<td>${cell(a,d)}</td>`).join('')}</tr>`),
  `<tr><td><b>${F.type?'Agents en '+esc((vs.find(v=>v.code===F.type)||{nom:F.type}).nom):'Agents programmés'}</b>${!multi&&!filtre?`<br><span class="sub">minimum requis : ${svc(F.svc).min}</span>`:''}</td>${days.map(d=>{const n=compte(d);return`<td><span class="pill ${!multi&&!filtre?(n<svc(F.svc).min?'crit':'ok'):'mute'}">${n}</span></td>`}).join('')}</tr>`]:[],'Aucun agent ne correspond à ces critères.');
 return`<div class="head"><div><h1>Planning</h1><div class="sub">${multi?'Tous les services':esc(svc(F.svc).nom)} · ${F.vue==='jour'?fdate(F.date):`semaine du ${fdate(days[0])} au ${fdate(days[6])}`} · ${as.length} agent(s)</div></div><span class="sp"></span>${ed?'<button class="btn" data-act="plSerie">Programmer en série</button>':''}</div>${barre}<div class="card plan">${corps}${legende}</div>`;
};

PAGES.agents=()=>{
 const ids=sel(),as=DB.agents.filter(a=>ids.includes(a.serviceId)),T=today();
 return`<div class="head"><div><h1>Agents</h1><div class="sub">${as.length} agent(s) dans votre périmètre</div></div><span class="sp"></span><input type="search" id="q" data-inp="q" placeholder="Rechercher : matricule, prénom, nom, téléphone, poste" aria-label="Rechercher un agent" style="min-width:230px">${svcSelect()}<button class="btn g" data-act="expOpen">Exporter par critères</button>${can('agents')?'<button class="btn" data-act="newAgent">Nouvel agent</button>':''}</div>
 <div class="card">${table(['Matricule','Agent','Service','Catégorie socio-professionnelle','Poste','Situation','Congé disponible','Aujourd\'hui'],as.map(a=>`<tr class="clic" data-act="agent" data-id="${a.id}" data-s="${esc((a.mat+' '+nomA(a)+' '+(a.tel||'')+' '+String(a.tel||'').replace(/\s/g,'')+' '+poste(a.posteId).nom+' '+fnom(a)+' '+svc(a.serviceId).nom).toLowerCase())}"><td>${a.mat}</td><td><b>${esc(nomA(a))}</b></td><td>${esc(svc(a.serviceId).nom)}</td><td>${esc(poste(a.posteId).nom)}</td><td>${esc(fnom(a))}</td><td>${esc(a.situation)}</td><td>${(ds=>ds.map(d=>{const n=conges(a.id,d.id).dispo;return`<span class="pill ${n<0?'crit':'ok'}">${ds.length>1?esc(d.nom.replace('Congé ',''))+' : ':''}${nj(n)}</span>`}).join(' '))(droitsDe(a))}</td><td>${pill(etat(a.id,T).statut)}</td></tr>`))}</div>`;
};
PAGES.agent=()=>{
 const a=ag(S.agentId);if(!a||(!scope().includes(a.serviceId)))return'<div class="empty">Dossier hors de votre périmètre.</div>';
 const T=today(),B=bilan(a.id,addDays(T,-29),T),afs=DB.affectations.filter(x=>x.agentId===a.id).sort((x,y)=>x.debut<y.debut?1:-1),abs=DB.absences.filter(x=>x.agentId===a.id),cor=DB.corrections.filter(x=>x.agentId===a.id);
 return`<div class="head"><button class="btn g" data-act="go" data-p="${ROLES[S.profil.role].menu.includes('agents')?'agents':'dashboard'}">← Retour</button>${avatar(a)}<div><h1>${esc(nomA(a))}</h1><div class="sub">Dossier administratif · matricule ${a.mat}</div></div><span class="sp"></span>${can('agents')?`<label class="btn g">${a.photo?'Changer la photo':'Ajouter une photo'}<input type="file" accept="image/*" data-chg="photo" data-id="${a.id}" hidden></label>`:''}<button class="btn g" data-act="resume" data-id="${a.id}">Télécharger le résumé (PDF)</button><button class="btn g" data-act="rapAgent" data-id="${a.id}">Rapport de présence</button>${can('agents')?`<button class="btn" data-act="mvt" data-id="${a.id}">Enregistrer un mouvement</button>`:''}</div>
 <div class="card"><div class="head" style="margin-bottom:12px"><h2>Identification et situation professionnelle</h2><span class="sp"></span>${ed('agent',a.id)}</div><dl class="fiche">${[['Sexe',a.sexe==='F'?'Féminin':'Masculin'],['Date de naissance',a.naissance?dfr(a.naissance):''],['Téléphone',a.tel],['Adresse électronique',a.email],['Adresse de résidence',a.adresse],['Corps',a.corps],['Grade',a.grade],['Statut administratif',a.statut],['Service actuel',svc(a.serviceId).nom],['Catégorie socio-professionnelle',poste(a.posteId).nom],['Poste occupé',fnom(a)],['Prise de service',dfr(a.entree)],['Situation',a.situation],['Responsable hiérarchique',nomA(ag(svc(a.serviceId).chef))]].map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v||'—')}</dd></div>`).join('')}</dl></div>
 ${rhFiche(a)}<h2>Présence sur 30 jours</h2><div class="grid kpis">${[['Jours programmés',B.jProg],['Jours de présence',B.jPres],['Retards',B.nRet+' · '+B.minRet+' min'],['Absences non justifiées',B.jAbsNJ],['Heures de présence',dur(B.hPres)],['Taux de présence',B.taux==null?'—':Math.round(B.taux*100)+' %']].map(([l,n])=>`<div class="kpi" style="cursor:default"><b style="font-size:20px">${n}</b><span>${l} · 30 jours</span></div>`).join('')}</div>
 <div class="card"><h2>Historique des affectations et des postes</h2>${table(['Début dans le poste','Fin','Durée dans le poste','Service','Catégorie','Poste','Motif','Référence','Note de service','Enregistré par','Actions'],afs.map(x=>`<tr><td>${dfr(x.debut)}</td><td>${x.fin?dfr(x.fin):'<span class="pill ok">en cours</span>'}</td><td><b>${anciennete(x.debut,x.fin)}</b></td><td>${esc(svc(x.serviceId).nom)}</td><td>${esc(poste(x.posteId).nom)}</td><td>${esc(fnom(x))}</td><td>${esc(x.motif)}</td><td>${esc(x.ref||'—')}</td><td>${(n=>n?`<div class="row" style="flex-wrap:nowrap">${oeil(n.id)}<button class="btn g s" data-act="docDl" data-id="${n.id}">Télécharger</button></div>`:can('agents')?`<button class="btn g s" data-act="newDoc" data-id="${a.id}" data-m="${x.id}">Joindre</button>`:'—')(DB.documents.find(z=>z.mouvementId===x.id))}</td><td>${esc(x.par)}</td><td>${ed('aff',x.id)}</td></tr>`))}</div>
 <div class="card"><div class="head" style="margin-bottom:12px"><h2>Congés ${T.slice(0,4)}</h2><span class="sp"></span>${a.sexe==='F'&&can('absCreer')?`<button class="btn g s" data-act="mater" data-id="${a.id}">Calculer un congé de maternité</button>`:''}</div>${table(['Type de congé','Droit annuel','Acquis à ce jour','Report','Pris','En attente','Disponible'],droitsDe(a).map(d=>{const c=conges(a.id,d.id);return`<tr><td><b>${esc(d.nom)}</b><br><span class="sub">${d.mode==='mensuel'?'acquisition mensuelle':'droit annuel entier'}</span></td><td>${nj(d.joursAn)}</td><td>${nj(c.acquis)}</td><td>${nj(c.report)}</td><td>${nj(c.pris)}</td><td>${nj(c.attente)}</td><td><span class="pill ${c.dispo<0?'crit':'ok'}">${nj(c.dispo)}</span></td></tr>`}),'Aucun type de congé ne concerne cet agent.')}<div class="sub" style="margin-top:8px">Chaque absence imputée sur un congé est retirée de son solde, en jours calendaires. Le congé de maternité n'est imputé sur aucun solde.</div>
 <h3 style="margin:14px 0 8px">Décisions de congé de l'agent</h3>${table(['N° de décision','Date','Type','Période','Jours acquis','Reliquat','Jours consommés','Accordés','Consommés depuis','Reportés','Jours restants','Expiration','Actions'],decLignes(a.id).reverse().map(({d,l})=>{const e=decEtat(d,l);return`<tr><td><b>${esc(d.numero)}</b></td><td>${dfr(d.date)}</td><td>${esc((droit(d.droitId)||{}).nom||'—')}</td><td>${dfr(l.periodeDebut)}<br>${dfr(l.periodeFin)}</td><td>${l.jours}</td><td>${l.reliquat||'—'}</td><td>${l.deduction||'—'}</td><td>${nj(l.total)}</td><td>${e.cons||'—'}</td><td>${l.reporte||'—'}</td><td><span class="pill ${e.expiree?'mute':e.restant>0?'ok':'mute'}">${nj(Math.max(0,e.restant))}</span></td><td>${e.expiree?'<span class="pill crit">expirée</span>':`${dfr(e.expire)}<br><span class="pill ${e.restant>0&&e.jExp<=DB.params.congeAlerteJours?'warn':'mute'}">dans ${e.jExp} j</span>`}</td><td><button class="btn g s" data-act="decPdf" data-id="${d.id}">Télécharger</button></td></tr>`}),'Aucune décision de congé pour cet agent.')}</div>
 <div class="card"><div class="head" style="margin-bottom:12px"><h2>Documents du dossier</h2><span class="sp"></span>${can('agents')?`<button class="btn s" data-act="newDoc" data-id="${a.id}">Ajouter un document</button>`:''}</div>${table(['Type','Intitulé','Fichier','Taille','Ajouté par','Le','Actions'],DB.documents.filter(x=>x.agentId===a.id).map(x=>`<tr><td><span class="pill info">${esc(x.type)}</span></td><td><b>${esc(x.titre)}</b></td><td>${esc(x.nom)}</td><td>${taille(x.taille)}</td><td>${esc(x.par)}</td><td>${fdt(x.t)}</td><td><div class="row" style="flex-wrap:nowrap">${oeil(x.id)}<button class="btn g s" data-act="docDl" data-id="${x.id}">Télécharger</button>${ed('doc',x.id)}${can('agents')?`<button class="btn r s" data-act="docDel" data-id="${x.id}">Retirer</button>`:''}</div></td></tr>`),'Aucun document. Ajoutez les notes de service, décisions, diplômes ou autres pièces de l\'agent.')}</div>
 <div class="grid two"><div class="card"><h2>Congés, permissions et absences</h2>${table(['Type','Du','Au','Jours','Imputé sur','Statut','Actions'],abs.map(x=>`<tr><td>${esc(x.type)}</td><td>${dfr(x.debut)}</td><td>${dfr(x.fin)}</td><td>${absCalc(x).j}</td><td>${x.compte&&droit(x.compte)?`<span class="pill warn">${esc(droit(x.compte).nom)}</span>`:'—'}</td><td>${suiviPill(x)}</td><td>${ed('abs',x.id)}</td></tr>`),'Aucune absence enregistrée.')}</div>
 <div class="card"><h2>Corrections de pointage</h2>${table(['Jour','Avant','Après','Motif','Par'],cor.map(c=>`<tr><td>${c.date}</td><td>${c.avant.absent?'absent':hm(c.avant.arr)+' → '+hm(c.avant.dep)}</td><td>${hm(c.apres.arr)} → ${hm(c.apres.dep)}</td><td>${esc(c.motif)}</td><td>${esc(c.par)}</td></tr>`),'Aucune correction.')}</div></div>`;
};

PAGES.services=()=>`<div class="head"><div><h1>Services</h1><div class="sub">Établissement → pôle → service</div></div><span class="sp"></span>${can('config')?'<button class="btn" data-act="newSvc">Nouveau service</button>':''}</div>
 <div class="card">${table(['Code','Service','Type','Pôle','Responsable','Major','Effectif réel / théorique','Minimum par vacation','Règles et vacations','Statut','Actions'],DB.services.map(s=>{const n=actifs([s.id]).length;return`<tr><td>${esc(s.code)}</td><td><b>${esc(s.nom)}</b></td><td>${esc(s.type)}</td><td>${esc(s.pole)}</td><td>${esc(nomA(ag(s.chef)))}</td><td>${esc(nomA(ag(s.major)))}</td><td><span class="pill ${n<s.theorique?'warn':'ok'}">${n} / ${s.theorique}</span></td><td>${s.min}</td><td>${aPropre(s.id)?'<span class="pill info">propres au service</span>':'<span class="sub">établissement</span>'}</td><td>${s.actif?'<span class="pill ok">actif</span>':'<span class="pill mute">inactif</span>'}</td><td>${ed('svc',s.id)}</td></tr>`}))}</div>`;
PAGES.postes=()=>`<div class="head"><div><h1>Catégories et postes</h1><div class="sub">Catégories socio-professionnelles et postes occupés par les agents</div></div></div>
 <div class="grid two"><div class="card"><div class="head" style="margin-bottom:12px"><h2>Catégories socio-professionnelles</h2><span class="sp"></span>${can('config')?'<button class="btn s" data-act="newPoste">Nouvelle catégorie</button>':''}</div>${table(['Code','Intitulé','Catégorie','Corps','Agents','Actions'],DB.postes.map(p=>`<tr><td>${esc(p.code)}</td><td><b>${esc(p.nom)}</b></td><td>${esc(p.categorie||'—')}</td><td>${esc(p.corps||'—')}</td><td>${DB.agents.filter(a=>a.posteId===p.id).length}</td><td>${ed('cat',p.id)}</td></tr>`))}</div>
 <div class="card"><div class="head" style="margin-bottom:12px"><h2>Postes</h2><span class="sp"></span>${can('config')?'<button class="btn s" data-act="addList" data-kind="fonc">Nouveau poste</button>':''}</div>${table(['Poste','Agents en poste','Actions'],DB.fonctions.map(f=>`<tr><td><b>${esc(f.nom)}</b></td><td>${DB.agents.filter(a=>a.fonctionId===f.id).length}</td><td>${ed('fonc',f.id)}</td></tr>`))}</div></div>`;
PAGES.mouvements=()=>{const l=DB.affectations.slice().sort((x,y)=>x.debut<y.debut?1:-1);
 return`<div class="head"><div><h1>Affectations et mouvements</h1><div class="sub">Chaque mouvement clôture l'affectation précédente sans la supprimer. Ouvrez un dossier d'agent pour enregistrer un mouvement.</div></div></div>
 <div class="card">${table(['Agent','Service','Catégorie','Poste','Début dans le poste','Fin','Durée dans le poste','Motif','Référence','Par'],l.map(x=>`<tr class="clic" data-act="agent" data-id="${x.agentId}"><td><b>${esc(nomA(ag(x.agentId)))}</b></td><td>${x.ancienService?esc(svc(x.ancienService).code)+' → ':''}${esc(svc(x.serviceId).nom)}</td><td>${x.ancienPoste&&x.ancienPoste!==x.posteId?esc(x.ancienPoste)+' → ':''}${esc(poste(x.posteId).nom)}</td><td>${x.ancienneFonction&&x.ancienneFonction!==x.fonctionId?esc(fnom({fonctionId:x.ancienneFonction}))+' → ':''}${esc(fnom(x))}</td><td>${dfr(x.debut)}</td><td>${x.fin?dfr(x.fin):'<span class="pill ok">en cours</span>'}</td><td>${anciennete(x.debut,x.fin)}</td><td>${esc(x.motif)}</td><td>${esc(x.ref||'—')}</td><td>${esc(x.par)}</td></tr>`))}</div>`};

const absPill=s=>`<span class="pill ${{'approuvée':'ok','demandée':'warn','rejetée':'crit','annulée':'mute'}[s]}">${s}</span>`;
const absCalc=x=>{let j=0,h=0;for(let d=x.debut;d<=x.fin;d=addDays(d,1)){j++;const v=vacOf(x.agentId,d);if(v&&v.travail&&v.debut&&v.fin){const b=bornes(v,d);h+=(b.e-b.s)/6e4}}return{j,h}};
PAGES.absences=()=>{const ids=sel(),l=DB.absences.filter(x=>ids.includes(ag(x.agentId).serviceId)).sort((x,y)=>x.debut<y.debut?1:-1);
 return`<div class="head"><div><h1>Absences et congés</h1><div class="sub">${l.filter(x=>x.statut==='demandée').length} demande(s) en attente de validation</div></div><span class="sp"></span>${svcSelect()}${can('absCreer')?'<button class="btn g" data-act="demNew">Demande de congé</button>':''}${can('config')?'<button class="btn g" data-act="decNew">Décision de congé</button>':''}${can('absCreer')?'<button class="btn g" data-act="rayons">Congé + rayons</button><button class="btn g" data-act="mater">Congé de maternité</button><button class="btn" data-act="newAbs">Nouvelle absence</button>':''}</div>
 <div class="card">${table(['Agent','Type','Du','Au','Jours','Imputé sur','Heures programmées','Motif','Suivi','Circuit de validation','Actions'],l.map(x=>{const a=ag(x.agentId),c=absCalc(x);return`<tr><td><b>${esc(nomA(a))}</b><br><span class="sub">${esc(svc(a.serviceId).nom)}</span></td><td>${esc(x.type)}</td><td>${dfr(x.debut)}</td><td>${dfr(x.fin)}</td><td>${c.j}</td><td>${x.compte&&droit(x.compte)?`<span class="pill warn">${esc(droit(x.compte).nom)}</span><br><span class="sub">solde : ${nj(conges(a.id,x.compte).dispo)}</span>`:'—'}</td><td>${dur(c.h)}</td><td>${esc(x.motif)}</td><td>${suiviPill(x)}</td><td>${absValid(x)}</td><td><div class="row">${x.numDecision?`<button class="btn g s" data-act="absDec" data-id="${x.id}">Décision n° ${esc(x.numDecision)}</button>`:''}${x.statut==='approuvée'&&/^Congé/.test(x.type)?`<button class="btn g s" data-act="cessation" data-id="${x.id}">Cessation</button>${today()>=addDays(x.fin,-DB.params.repriseJours)?`<button class="btn v s" data-act="reprise" data-id="${x.id}">Note de reprise</button>`:''}`:''}${ed('abs',x.id)}</div></td></tr>`}),'Aucune absence enregistrée.')}</div>
 ${ROLES[S.profil.role].menu.includes('demandes')?'<div class="card"><div class="row"><span>Les demandes de décision et les décisions de congé se trouvent dans la rubrique Demandes & Décisions.</span><button class="btn g s" data-act="go" data-p="demandes">Ouvrir Demandes & Décisions</button></div></div>':''}`};

 const ids=sel(),R=S.rap,as=DB.agents.filter(a=>ids.includes(a.serviceId));if(R.agentId&&!as.some(a=>a.id===R.agentId))R.agentId='';

 S.tsv=[['Date','Vacation','Arrivée prévue','Arrivée réelle','Départ prévu','Départ réel','Retard (min)','Statut','Observation'],...rows.map(r=>[r.date,r.vac?r.vac.nom:'',r.s?hm(r.s):'',r.p&&r.p.arr?hm(r.p.arr):'',r.e?hm(r.e):'',r.p&&r.p.dep?hm(r.p.dep):'',r.retard||'',LIB[r.statut][0],obs(r)])];

 <div class="card"><h2>Détail chronologique</h2>${table(S.tsv[0],rows.map((r,i)=>`<tr>${S.tsv[i+1].map((c,j)=>`<td>${j===7?pill(r.statut):esc(c||'—')}</td>`).join('')}</tr>`),'Aucune vacation sur la période.')}</div>`;
};

   if(c){x.decisionId=c.d.id;const r=c.e.restant-n;msg+=` Imputé sur la décision n° ${c.d.numero} : ${nj(n)} consommé(s), ${nj(r)} restant(s).`;if(r<0){msg+=' Le solde de la décision est dépassé.';kind='err'}}

 plSerieOk:()=>{const sid=val('ps_svc'),po=val('ps_poste'),txt=val('ps_ag').trim(),aid=pickId('ps_ag'),du=val('ps_du'),au=val('ps_au'),c=val('ps_type'),T=today(),jr=[...document.querySelectorAll('.pjr:checked')].map(x=>+x.value);
  if(txt&&!aid)return toast('Agent non trouvé. Précisez la recherche ou videz le champ.','err');let as=actifs([sid]);if(aid)as=[ag(aid)];else if(po)as=as.filter(a=>a.fonctionId===po);
  if(!as.length)return toast('Aucun agent ne correspond à ce service et à ce poste.','err');if(!du||!au||au<du)return toast('Vérifiez les dates : la fin doit suivre le début.','err');if(diffJ(du,au)>92)return toast('La période ne peut pas dépasser trois mois.','err');if(!jr.length)return toast('Cochez au moins un jour de la semaine.','err');

  toast(`${r.n} vacation(s) programmée(s)${r.skip?`, ${r.skip} ignorée(s) (jour passé ou déjà pointé)`:''}.`,r.n?'ok':'err');render()},
 demNew:()=>{const me=S.profil.role==='agent',as=me?[ag(S.profil.agentId)]:DB.agents.filter(a=>a.situation!=='sorti des effectifs'&&scope().includes(a.serviceId));

 demOk:()=>{const id=pickId('dm_ag'),a=ag(id),dr=droit(val('dm_droit'));if(!a)return toast('Agent non trouvé. Précisez la recherche ou choisissez-le dans la liste.','err');
  if(!droitsDe(a).includes(dr))return toast(`${nomA(a)} n'a pas droit au « ${dr.nom} » : son service n'est pas concerné.`,'err');
  const m={id:'M'+uid(),agentId:id,droitId:dr.id,date:val('dm_date')||today(),periodeDebut:val('dm_du'),periodeFin:val('dm_au'),jours:Math.max(0,parseFloat(val('dm_j'))||0),decPrecNum:val('dm_pn').trim(),decPrecDate:val('dm_pd'),statut:'en cours',par:who(),cree:new Date().toISOString()};
  if(!m.periodeDebut||!m.periodeFin||m.periodeFin<=m.periodeDebut)return toast('Vérifiez la période : la fin doit suivre le début.','err');if(!m.jours)return toast('Indiquez le nombre de jours demandés.','err');

  DB.demandes.push(m);audit('Demande de décision de congé',`${nomA(a)} — ${dr.nom}, ${nj(m.jours)}, période du ${dfr(m.periodeDebut)} au ${dfr(m.periodeFin)}`);save();closeModal();toast('Demande enregistrée : statut « demande en cours ».','ok');if(ROLES[S.profil.role].menu.includes('demandes'))S.page='demandes';render()},
 demRej:d=>{const m=DB.demandes.find(z=>z.id===d.id);modal(`Rejeter la demande — ${nomA(ag(m.agentId))}`,`<label class="field">Motif du rejet (obligatoire)<textarea id="r_motif" rows="3"></textarea></label>`,`<button class="btn g" data-act="close">Annuler</button><button class="btn r" data-act="demRejOk" data-id="${m.id}">Rejeter la demande</button>`)},
 demRejOk:d=>{const m=DB.demandes.find(z=>z.id===d.id),t=val('r_motif').trim();if(!t)return toast('Le motif du rejet est obligatoire.','err');m.statut='rejetée';m.motifRejet=t;m.traiteLe=new Date().toISOString();audit('Demande de décision rejetée',`${nomA(ag(m.agentId))} — motif : ${t}`);save();closeModal();toast('Demande rejetée avec motif.','ok');render()},

 demDec:d=>{const m=DB.demandes.find(z=>z.id===d.id);S.dec={numero:'',date:today(),droitId:m.droitId,lignes:[{agentId:m.agentId,periodeDebut:m.periodeDebut,periodeFin:m.periodeFin,jours:m.jours,reliquat:0,deduction:0}]};decModal()},

 decOk:()=>{const D=S.dec,num=D.numero.trim();if(!num)return toast('Indiquez le numéro de la décision.','err');if(DB.decisions.some(z=>z.numero===num))return toast('Ce numéro de décision existe déjà.','err');if(!D.date)return toast('Indiquez la date de la décision.','err');if(!D.lignes.length)return toast('Ajoutez au moins un agent à la décision.','err');

  if(!b)return toast('Ce fichier n\'est pas présent sur cet appareil. Il a été ajouté depuis un autre poste.','err');await telecharger(x.nom,b)},
 docVoir:async d=>{const x=DB.documents.find(z=>z.id===d.id);let b;try{b=await fileGet(x.id)}catch(e){}
  if(!b)return toast('Ce fichier n\'est pas présent sur cet appareil. Il a été ajouté depuis un autre poste.','err');
  const ext=(x.nom.split('.').pop()||'').toLowerCase(),foot=`<button class="btn" data-act="docDl" data-id="${x.id}">Télécharger</button>`,t=`${x.titre} — ${x.nom}`;
  if(['png','jpg','jpeg','webp','gif'].includes(ext))return modal(t,`<img src="${URL.createObjectURL(b)}" alt="${esc(x.titre)}" style="max-width:100%;border-radius:8px">`,foot);
  if(['txt','csv'].includes(ext))return modal(t,`<pre style="white-space:pre-wrap;max-height:60vh;overflow:auto;background:var(--mute);padding:12px;border-radius:8px;margin:0">${esc((await b.text()).slice(0,20000))}</pre>`,foot);
  if(ext!=='pdf')return modal(t,`<p>L'aperçu n'est pas disponible pour les fichiers .${esc(ext)}. Téléchargez le document pour l'ouvrir.</p>`,foot);
  modal(t,`<div id="pdfv" style="display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--mute);padding:10px;border-radius:8px"><div class="sub">Chargement de l'aperçu…</div></div>`,foot);
  try{await loadPdfJs();const pdf=await window.pdfjsLib.getDocument({data:await b.arrayBuffer()}).promise,box=$('#pdfv');if(!box)return;box.innerHTML='';const n=Math.min(pdf.numPages,15);
   for(let k=1;k<=n;k++){const pg=await pdf.getPage(k),vp=pg.getViewport({scale:1.4}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.style.cssText='max-width:100%;height:auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)';if(!$('#pdfv'))return;box.appendChild(c);await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}
   if(pdf.numPages>n)box.insertAdjacentHTML('beforeend',`<div class="sub">Aperçu limité aux ${n} premières pages sur ${pdf.numPages}. Téléchargez le document pour le lire en entier.</div>`)}
  catch(e){const box=$('#pdfv');if(box)box.innerHTML='<div class="sub">L\'aperçu n\'a pas pu être affiché. Téléchargez le document pour l\'ouvrir.</div>'}},
 docDel:d=>{const x=DB.documents.find(z=>z.id===d.id);modal('Retirer un document',`<p>Retirer « <b>${esc(x.titre)}</b> » (${esc(x.nom)}) du dossier ? Le retrait est inscrit au journal d'audit.</p>`,`<button class="btn g" data-act="close">Annuler</button><button class="btn r" data-act="docDelOk" data-id="${x.id}">Retirer le document</button>`)},

 edit:d=>{const E=EDIT[d.k],x=E.get(d.id),fs=E.f(x);
  modal(`${E.t} — ${E.lib(x)}`,`<div class="form">${fs.map(([k,l,t,o,add])=>{const v=x[k]===true?'1':x[k]===false?'0':(x[k]??'');
   return`<label class="field">${esc(l)}${t==='select'||t==='bool'?`<select id="e_${k}"${add?` data-add="${add}"`:''}>${opt(t==='bool'?[['1','oui'],['0','non']]:o,String(v),z=>z)}${add?addOpt():''}</select>`:t==='area'?`<textarea id="e_${k}" rows="4">${esc(v)}</textarea>`:`<input id="e_${k}" type="${t}"${t==='number'?' min="0" step="0.5"':''} value="${esc(v)}">`}</label>`}).join('')}</div>
   <label class="field">Motif de la correction${E.motif?' (obligatoire)':' (facultatif)'}<textarea id="e_motif" rows="2"></textarea></label><div class="sub">Les anciennes valeurs sont inscrites au journal d'audit avec votre nom.</div>`,`<button class="btn g" data-act="close">Annuler</button><button class="btn" data-act="editOk" data-k="${d.k}" data-id="${esc(d.id)}">Enregistrer la correction</button>`)},
 editOk:d=>{const E=EDIT[d.k],x=E.get(d.id),fs=E.f(x),v={},motif=val('e_motif').trim();
  for(const[k,,t]of fs){let z=val('e_'+k);if(z==='__add__')return toast('Choisissez une valeur dans chaque liste.','err');if(typeof z==='string')z=z.trim();v[k]=t==='bool'?z==='1':t==='number'?(z===''&&NULLS.includes(k)?null:(+z||0)):(z===''&&NULLS.includes(k)?null:z)}
  const err=E.check&&E.check(v);if(err)return toast(err,'err');if(E.motif&&!motif)return toast('Le motif de la correction est obligatoire.','err');
  const diff=fs.filter(([k])=>(x[k]??'')!==(v[k]??'')&&!(x[k]==null&&v[k]==='')&&!(x[k]===undefined&&v[k]===0)),aff=z=>z===true?'oui':z===false?'non':(z===null||z===undefined||z===''?'vide':z);
  if(!diff.length)return toast('Aucune modification à enregistrer.','err');
  const detail=diff.map(([k,l])=>`${l} : ${k==='pin'?'modifié':aff(x[k])+' → '+aff(v[k])}`).join(' ; ');
  diff.forEach(([k])=>x[k]=v[k]);if(E.after)E.after(x);x.corrigeLe=new Date().toISOString();
  audit(E.t,`${E.lib(x)} — ${detail}${motif?' — motif : '+motif:''}`);save();closeModal();toast('Correction enregistrée et tracée dans le journal d\'audit.','ok');render()},
 mater:d=>{const fs=DB.agents.filter(a=>a.sexe==='F'&&a.situation!=='sorti des effectifs'&&scope().includes(a.serviceId)),P=DB.params;if(!fs.length)return toast('Aucun agent féminin dans votre périmètre.','err');
  modal('Calcul du congé de maternité',`<div class="form"><label class="field">Agent${agPick('mt_ag',fs,d.id||'')}</label><label class="field">Date présumée d'accouchement<input type="date" id="mt_dpa" data-inp="mater"></label><label class="field">Début du congé<input type="date" id="mt_deb" data-inp="mater"></label><label class="field">Date réelle d'accouchement (si connue)<input type="date" id="mt_reel" data-inp="mater"></label><label class="field">Prolongation pour suites pathologiques<select id="mt_pro" data-inp="mater">${opt([...Array(P.materProlong+1)].map((_,i)=>[String(i),i?i+' semaine'+(i>1?'s':''):'aucune']),'0',z=>z)}</select></label></div>

 materOk:async()=>{const id=pickId('mt_ag'),a=ag(id);if(!a)return toast('Agent non trouvé. Précisez la recherche ou choisissez-le dans la liste.','err');const r=materInfo();if(!r)return toast("Indiquez la date présumée d'accouchement.",'err');if(r.err)return toast(r.err,'err');

 droitSvc:d=>{const x=droit(d.id);modal(`Agents concernés — ${x.nom}`,`<label class="row"><input type="checkbox" id="dr_tous"${x.tous?' checked':''}> <b>Tous les agents de l'établissement</b></label><div class="sub">Ou seulement les agents des services cochés :</div><div class="form">${DB.services.map(v=>`<label class="row"><input type="checkbox" class="dck" value="${esc(v.id)}"${x.services.includes(v.id)?' checked':''}> ${esc(v.nom)}</label>`).join('')}</div>`,`<button class="btn g" data-act="close">Annuler</button><button class="btn" data-act="droitSvcOk" data-id="${x.id}">Enregistrer</button>`)},

 addDroit:()=>{const nom=val('dr_nom').trim(),j=Math.max(0,parseFloat(val('dr_j'))||0);if(!nom)return toast('Indiquez le nom du type de congé.','err');if(DB.droits.some(x=>x.nom.toLowerCase()===nom.toLowerCase()))return toast('Ce type de congé existe déjà.','err');

 addList:d=>openAdd(d.kind,null),

 delVac:d=>{const v=DB.vacations.find(x=>x.code===d.c),T=today(),n=Object.keys(DB.planning).filter(k=>DB.planning[k]===d.c&&k.split('|')[1]>=T).length;

  if(!/^[A-Z0-9]{1,3}$/.test(code))return toast('Le code doit comporter 1 à 3 lettres ou chiffres.','err');if(!nom)return toast('Indiquez le nom de la vacation.','err');

PAGES.bilan=()=>{const y=S.bil.year,B=S.bilan=bilanSocial(y),T=today(),ys=[0,1,2].map(i=>String(+T.slice(0,4)-i)),bloque=B.sansMotif.length,mxE=Math.max(1,...B.evo.map(e=>e[1])),tot=B.brut||1,pS=Math.round(B.base/tot*100),pC=Math.round(B.charges/tot*100);

/* ============ Circuit de validation : demande → avis du chef de service → validation RH → décision ============ */
Object.assign(CAN,{avis:['superadmin','chef'],drh:['superadmin','rh','directeur']});
const NAT={conge:'Congé (décision de congé)',affectation:'Affectation / mutation interne',nomination:'Nomination / promotion',disponibilite:'Mise en disponibilité',retraite:'Départ à la retraite'};
const migrateRH=migrate;
migrate=function(db){migrateRH(db);if(db.params.avisObligatoire===undefined)db.params.avisObligatoire=1;if(!db.listes.typesAbs.includes('Mise en disponibilité'))db.listes.typesAbs.push('Mise en disponibilité');(db.demandes||[]).forEach(m=>{if(!m.nature)m.nature='conge'});return db};
const canAvis=a=>can('avis')&&!!a&&scope().includes(a.serviceId);
const peutValider=o=>can('drh')&&(!!o.avis||!DB.params.avisObligatoire);
const numDecision=()=>{DB.seqDecision=(DB.seqDecision||0)+1;return String(DB.seqDecision).padStart(3,'0')+'/'+today().slice(0,4)};
const avisAuto=()=>({statut:'favorable',par:who(),t:new Date().toISOString(),auto:true,commentaire:''});
function circuit(o){const fini=o.statut==='approuvée'||o.statut==='décision établie',rej=o.statut==='rejetée',av=o.avis,st=(l,k,t)=>`<span class="pill ${k}" title="${esc(t||'')}">${l}</span>`,fl='<span class="sub">→</span>';
 return`<div class="row" style="gap:4px">${st('Demande ✓','ok',o.par?'saisie par '+o.par:'')}${fl}${av?st(av.statut==='favorable'?'Avis favorable ✓':'Avis défavorable ✗',av.statut==='favorable'?'ok':'crit','par '+av.par):st(fini||rej?'Sans avis du chef':'Avis du chef : en attente',fini||rej?'mute':'warn')}${fl}${fini?st('Approuvé ✓','ok',o.validePar?'par '+o.validePar:''):rej?st('Refusé ✗','crit',''):st('Validation RH : en attente',av||!DB.params.avisObligatoire?'warn':'mute')}</div>${av&&av.commentaire?`<div class="sub">Avis de ${esc(av.par)} : ${esc(av.commentaire)}</div>`:''}${rej&&o.motifRejet?`<div class="sub">Motif du refus : ${esc(o.motifRejet)}</div>`:''}`}
function absValid(x){const a=ag(x.agentId);let b='';if(x.statut==='demandée'){if(!x.avis&&canAvis(a))b+=`<button class="btn s" data-act="avis" data-t="abs" data-id="${x.id}">Donner mon avis</button>`;
  if(peutValider(x))b+=`<button class="btn v s" data-act="absVal" data-id="${x.id}">Valider</button><button class="btn r s" data-act="absRej" data-id="${x.id}">Refuser</button>`;else if(can('drh'))b+='<span class="sub">Validation possible après l\'avis du chef de service</span>'}
 return circuit(x)+(b?`<div class="row" style="margin-top:6px">${b}</div>`:'')}
const soldeDe=(a,compte)=>compte==='ADM'?soldeConge(a):compte?conges(a.id,compte).dispo:null;
function demResume(m){const g=k=>({svc:(svc(m.serviceId)||{}).nom,cat:(poste(m.posteId)||{}).nom,fonc:(fonc(m.fonctionId)||{}).nom})[k]||'';
 return m.nature==='affectation'?`Vers ${g('svc')} — ${g('cat')}, ${g('fonc')} · à compter du ${dfr(m.dateEffet)}`:m.nature==='nomination'?`${g('fonc')}${m.grade?', grade '+m.grade:''} (${g('cat')}) · à compter du ${dfr(m.dateEffet)}`:m.nature==='disponibilite'?`Du ${dfr(m.periodeDebut)} au ${dfr(m.periodeFin)}`:m.nature==='retraite'?`À compter du ${dfr(m.dateEffet)}`:`${(droit(m.droitId)||{}).nom||'Congé'} — ${nj(m.jours)}, période du ${dfr(m.periodeDebut)} au ${dfr(m.periodeFin)}`}
function demTable(ids){const l=DB.demandes.filter(m=>ag(m.agentId)&&ids.includes(ag(m.agentId).serviceId)).sort((x,y)=>x.date<y.date?1:-1);
 return`<div class="card"><div class="head" style="margin-bottom:12px"><h2>Demandes de décision</h2><span class="sp"></span><button class="btn s" data-act="demNew">Nouvelle demande</button></div>${table(['Agent','Demande','Demandée le','Circuit de validation','Actions'],l.map(m=>{const a=ag(m.agentId),cg=m.nature==='conge',d=m.decisionId&&DB.decisions.find(z=>z.id===m.decisionId);let b='';
  if(m.statut==='en cours'){if(!m.avis&&canAvis(a))b+=`<button class="btn s" data-act="avis" data-t="dem" data-id="${m.id}">Donner mon avis</button>`;
   if(peutValider(m))b+=`<button class="btn v s" data-act="${cg?'demDec':'demVal'}" data-id="${m.id}">${cg?'Établir la décision':'Valider'}</button><button class="btn r s" data-act="demRej" data-id="${m.id}">Refuser</button>`}
  b+=`<button class="btn g s" data-act="demPdf" data-id="${m.id}">Demande (PDF)</button>`;if(d)b+=`<button class="btn g s" data-act="decPdf" data-id="${d.id}">Décision n° ${esc(d.numero)}</button>`;if(m.numDecision)b+=`<button class="btn g s" data-act="demDecPdf" data-id="${m.id}">Décision n° ${esc(m.numDecision)}</button>`;
  return`<tr><td><b>${esc(nomA(a))}</b><br><span class="sub">${a.mat} · ${esc(svc(a.serviceId).nom)}</span></td><td><b>${esc(NAT[m.nature]||'Demande')}</b><br><span class="sub">${esc(demResume(m))}</span>${m.motif?`<br><span class="sub">Motif : ${esc(m.motif)}</span>`:''}</td><td>${dfr(m.date)}</td><td>${circuit(m)}</td><td><div class="row">${b}</div></td></tr>`}),'Aucune demande. Créez une demande : elle suit le circuit avis du chef de service, puis validation des ressources humaines.')}</div>`}
PAGES.demandes=()=>{const ids=sel(),h=demCartes(ids),i=h.indexOf('<div class="card"><div class="head" style="margin-bottom:12px"><h2>Décisions de congé</h2>'),att=DB.demandes.filter(m=>m.statut==='en cours'),P=DB.params;
 return`<div class="head"><div><h1>Demandes & Décisions</h1><div class="sub">${att.filter(m=>!m.avis).length} en attente de l'avis du chef · ${att.filter(m=>m.avis).length} en attente de validation RH · circuit : demande → avis du chef de service → validation RH → décision</div></div><span class="sp"></span>${svcSelect()}<button class="btn" data-act="demNew">Nouvelle demande</button>${can('config')?'<button class="btn g" data-act="decNew">Décision de congé</button>':''}</div>${P.avisObligatoire?'':'<div class="demo">L\'avis du chef de service est facultatif : les ressources humaines peuvent valider directement (réglage du Paramétrage).</div>'}${demTable(ids)}${i<0?'':h.slice(i)}`};

const demandePDFBase=demandePDF;

function simplifierPaie(db){const R=id=>db.rubriques.find(r=>r.id===id),byNom=n=>db.rubriques.find(r=>r.nom.toLowerCase()===n.toLowerCase()),T=dkey(new Date());
 if(!R('motiv')&&!byNom('Prime de motivation'))db.rubriques.push({id:'motiv',nom:'Prime de motivation',type:'gain',mode:'fixe',montant:30000,actif:true});
 if(!R('transp')&&!byNom('Indemnité de transport'))db.rubriques.push({id:'transp',nom:'Indemnité de transport',type:'gain',mode:'fixe',montant:16500,actif:true});
 const lg=R('logement');if(lg)lg.actif=false;
 const ordre=[R('base'),R('motiv')||byNom('Prime de motivation'),R('transp')||byNom('Indemnité de transport'),R('risque'),R('garde')].filter(Boolean);
 db.rubriques=[...ordre,...db.rubriques.filter(r=>r.type==='gain'&&!ordre.includes(r)),...db.rubriques.filter(r=>r.type!=='gain')];
 Object.values(LEG).forEach(k=>db.agents.forEach(a=>{if(a[k]===0||a[k]==='')delete a[k]}));
 const rr=(i,k)=>{const x=Math.sin(i*12.9898+k*78.233)*43758.5453;return x-Math.floor(x)},BASE={A:450000,B:280000,C:180000,D:120000};
 if(db.rhDemo)db.agents.forEach(a=>{const i=(+a.id-610204)/13;if(!estDemo(a)||!Number.isInteger(i))return;const b=BASE[((db.postes||[]).find(x=>x.id===a.posteId)||{}).categorie]||180000;
  if(a.salaireBase===b+Math.floor(rr(i,3)*6)*5000){const g=db.grille.cat[a.posteId]=db.grille.cat[a.posteId]||{};if(!estDef(g.base))g.base=b;delete a.salaireBase}});
 const act=db.agents.filter(a=>a.situation!=='sorti des effectifs'&&!(a.dateDepart&&a.dateDepart<=T));
 Object.entries(LEG).forEach(([rid,k])=>{const r=R(rid);if(!r)return;
  (db.postes||[]).forEach(p=>{const g=db.grille.cat[p.id]=db.grille.cat[p.id]||{};if(estDef(g[rid]))return;const vs=act.filter(a=>a.posteId===p.id&&estDef(a[k])).map(a=>+a[k]);if(!vs.length)return;
   const c={};vs.forEach(v=>c[v]=(c[v]||0)+1);g[rid]=+Object.keys(c).sort((x,y)=>c[y]-c[x]||x-y)[0]});
  db.agents.forEach(a=>{if(estDef(a[k])&&+a[k]===valGrille(db,a,r).v)delete a[k]})});
 db.agents.forEach(a=>{if(a.paie)Object.keys(a.paie).forEach(rid=>{const r=R(rid);if(r&&+a.paie[rid]===valGrille(db,a,r).v)delete a.paie[rid]})});
 const CL={MED:'Hors catégorie',INF:'7ème A',SFE:'7ème A',AS:'4ème',TLAB:'7ème A',MRAD:'7ème A',MAJ:'7ème B',SEC:'6ème',ADMN:'8ème A',BRA:'3ème',ENT:'3ème'},VI=['Thiès','Dakar','Tivaouane','Mbour','Saint-Louis','Kaolack','Diourbel','Louga','Rufisque','Ziguinchor'];
 if(db.rhDemo)db.agents.forEach((a,i)=>{if(!estDemo(a))return;if(!a.classement&&CL[a.posteId])a.classement=CL[a.posteId];if(!a.lieuNaissance)a.lieuNaissance=VI[(i*7)%VI.length]})}
const migrateRH3=migrate;
migrate=function(db){migrateRH3(db);const L=db.listes;L.classements=L.classements||['1ère A','1ère B','2ème','3ème','4ème','5ème','6ème','7ème A','7ème B','8ème A','8ème B','9ème','10ème','Hors catégorie'];
 db.paieArretee=db.paieArretee||{};if(!db.paieV2){db.paieV2=1;simplifierPaie(db)}return db};

 if(av===v)return{ok:true};if(l)l.montant=v;else L.splice(L.filter(x=>x.type==='gain').length,0,{rubId:rid,nom:r?r.nom:rid,type:'gain',montant:v});
 if(!L.some(x=>x.type==='retenue'))DB.rubriques.filter(x=>x.type==='retenue'&&x.actif!==false).forEach(x=>{const p=valRub(a,x);L.push(x.mode==='pct'?{rubId:x.id,nom:`${x.nom} (${String(p).replace('.',',')} %)`,type:'retenue',montant:0,pct:p}:{rubId:x.id,nom:x.nom,type:'retenue',montant:p})});

function catAjouter(service,nom,prix){let c=DB.pecCat.find(z=>z.service.toLowerCase()===service.toLowerCase());if(!c)DB.pecCat.push(c={service,actes:[]});const a=c.actes.find(z=>z.nom.toLowerCase()===nom.toLowerCase());if(a){const m=a.prix!==prix;a.prix=prix;return m?'maj':'idem'}c.actes.push({nom,prix});return'nouveau'}
pcCatCarte=function(){if(!can('pec'))return'';const svcs=DB.pecCat.map(c=>c.service),n=DB.pecCat.reduce((t,c)=>t+c.actes.length,0),sans=DB.pecCat.reduce((t,c)=>t+c.actes.filter(a=>!+a.prix).length,0);

function pcImportApercu(rows){const ok=rows.filter(r=>!r.err),nv=ok.filter(r=>r.etat==='nouveau').length,mj=ok.filter(r=>r.etat==='maj').length,er=rows.filter(r=>r.err).length;S.pcImp=rows;

function pcLire(ws){const X=window.XLSX,A=X.utils.sheet_to_json(ws,{header:1,defval:'',raw:true}).filter(r=>r.some(c=>String(c).trim()!==''));if(!A.length)return{err:'Le fichier est vide.'};
 const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();let h=-1,cs=-1,ca=-1,cp=-1;

async function clAuth(body,grant){

 const j=await r.json().catch(()=>({}));
 if(!r.ok){const e=new Error(/invalid/i.test(j.error_description||j.msg||j.error_code||'')?'Adresse e-mail ou mot de passe incorrect.':(j.error_description||j.msg||'Connexion refusée.'));e.status=r.status;e.auth=true;throw e}
 CL.sess={at:j.access_token,rt:j.refresh_token,exp:Date.now()+((j.expires_in||3600)-120)*1000,uid:j.user.id,email:j.user.email};lsSet('rhospi.sess',JSON.stringify(CL.sess));return CL.sess}
let CL_REF=null;
async function clTok(){if(!CL.sess){const e=new Error('Non connecté.');e.status=401;e.auth=true;throw e}
 if(Date.now()>CL.sess.exp){if(!CL_REF)CL_REF=clAuth({refresh_token:CL.sess.rt},'refresh_token').finally(()=>{CL_REF=null});await CL_REF}return CL.sess.at}
async function clApi(path,o={}){const at=await clTok(),h={apikey:CL.key,Authorization:'Bearer '+at,...(o.headers||{})};let body=o.body;
 if(body!==undefined&&!(typeof Blob!=='undefined'&&body instanceof Blob)){h['Content-Type']='application/json';body=JSON.stringify(body)}
 let r;try{r=await fetch(CL.url+path,{method:o.method||'GET',headers:h,body})}catch(e){const x=new Error('Pas de connexion au serveur.');x.reseau=true;throw x}
 if(o.raw){if(!r.ok){const x=new Error('Erreur '+r.status);x.status=r.status;throw x}return r}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok){const e=new Error((j&&(j.message||j.error||j.msg))||('Erreur '+r.status));e.status=r.status;e.code=j&&j.code;if(r.status===401)e.auth=true;throw e}return j}

async function clCacheLire(){try{return await clIdbDo('readonly',x=>x.get(clCleCache()))}catch(e){return null}}
function clCache(){clearTimeout(CL.tCache);CL.tCache=setTimeout(clCacheMaintenant,1500)}
function clCacheMaintenant(){clearTimeout(CL.tCache);if(!CL.ready||!CL.sess)return Promise.resolve();
 try{return clIdbDo('readwrite',x=>x.put({db:DB,cur:CL.cur,pend:[...CL.pend.entries()],t:Date.now()},clCleCache())).catch(()=>{})}catch(e){return Promise.resolve()}}

/* --- Envoi : seuls les enregistrements modifiés partent, par lots --- */
function clDiff(){if(!CL.ready)return;const now=clRows(DB);
 for(const[k,j]of now)if(CL.last.get(k)!==j){CL.pend.set(k,j);CL.last.set(k,j)}
 for(const k of[...CL.last.keys()])if(!now.has(k)){CL.last.delete(k);const c=k.slice(2,k.indexOf(CL_SEP));if(k[0]==='a'&&CL_AJOUT.includes(c))continue;CL.pend.set(k,null)}}
function clPlanifier(){if(!CL.ready)return;clearTimeout(CL.tPush);CL.tPush=setTimeout(()=>{clDiff();clEtat();clCache();clPush()},700)}
const clLigne=([k,j])=>{const i=k.indexOf(CL_SEP),c=k.slice(0,i),id=k.slice(i+1);return j===null?[c,id,null,true]:[c,id,JSON.parse(j),false]};
async function clPush(){if(CL.busy||!CL.pend.size||!CL.ready)return;CL.busy=true;clEtat();let encore=false;
 try{const all=[...CL.pend.entries()];
  for(let i=0;i<all.length;i+=CL_LOT){const lot=all.slice(i,i+CL_LOT);
   try{await clRpc('rh_push',{p_org:CL.org,p_rows:lot.map(clLigne)})}
   catch(e){if(e.code!=='42501')throw e; // un enregistrement non autorisé : on envoie un par un pour garder les autres
    for(const x of lot){try{await clRpc('rh_push',{p_org:CL.org,p_rows:[clLigne(x)]})}catch(e2){if(e2.code!=='42501')throw e2;CL.refus++}}}
   for(const[k,j]of lot)if(CL.pend.get(k)===j)CL.pend.delete(k)}
  CL.err='';CL.horsLigne=false;encore=CL.pend.size>0}
 catch(e){CL.horsLigne=!!e.reseau;CL.err=e.reseau?'':e.message;if(e.auth)clSessionPerdue()}
 finally{CL.busy=false;clEtat();clCache()}
 if(encore)setTimeout(clPush,50)}

/* --- Réception : seules les modifications depuis le dernier passage sont lues --- */
function clLot(rows){let n=0;const parA=new Map();
 for(const[coll,id,data,del]of rows){const key=coll+CL_SEP+id;if(CL.pend.has(key))continue;
  const j=del?null:JSON.stringify(data);if(del?!CL.last.has(key):CL.last.get(key)===j)continue;n++;
  if(del)CL.last.delete(key);else CL.last.set(key,j);
  const t=coll[0],k=coll.slice(2);
  if(t==='a'){if(!parA.has(k))parA.set(k,new Map());parA.get(k).set(id,[data,del])}
  else if(t==='m'){const o=DB[k]&&typeof DB[k]==='object'&&!Array.isArray(DB[k])?DB[k]:(DB[k]={});if(del)delete o[id];else o[id]=data}
  else if(k==='__forme'){if(!del&&data)for(const[x,f]of Object.entries(data)){if(f==='a'&&!Array.isArray(DB[x]))DB[x]=[];if(f==='m'&&(!DB[x]||typeof DB[x]!=='object'))DB[x]={}}}
  else if(del)delete DB[k];else DB[k]=(/^seq/.test(k)&&typeof DB[k]==='number'&&typeof data==='number')?Math.max(DB[k],data):data}
 for(const[k,l]of parA){let a=Array.isArray(DB[k])?DB[k]:[];const ix=new Map();a.forEach((x,i)=>ix.set(String(x.id),i));const nv=[],sup=new Set();
  for(const[id,[data,del]]of l){const i=ix.get(id);if(del){if(i!==undefined)sup.add(i)}else if(i!==undefined)a[i]=data;else nv.push(data)}
  if(sup.size)a=a.filter((_,i)=>!sup.has(i));
  if(nv.length)a=CL_UNSHIFT.includes(k)?nv.reverse().concat(a):a.concat(nv);
  if(k==='audit'&&a.length>500)a.length=500;DB[k]=a}
 return n}
async function clPull(prog){if(CL.pulling)return 0;CL.pulling=true;let n=0;
 try{let c=CL.cur?{maj:new Date(new Date(CL.cur.maj).getTime()-15000).toISOString(),coll:'',id:''}:{maj:'-infinity',coll:'',id:''};
  for(let tour=0;tour<500;tour++){const r=await clRpc('rh_pull',{p_org:CL.org,p_maj:c.maj,p_coll:c.coll,p_id:c.id,p_lim:CL_PAGE});
   n+=clLot(r.rows);
   if(r.rows.length){const l=r.rows[r.rows.length-1];c={maj:l[4],coll:l[0],id:l[1]};if(!CL.cur||new Date(l[4])>new Date(CL.cur.maj))CL.cur={maj:l[4]}}
   if(prog)prog(n);if(r.rows.length<CL_PAGE)break}
  CL.horsLigne=false;if(!CL.pend.size)CL.err=''}
 catch(e){CL.horsLigne=!!e.reseau;if(!e.reseau)CL.err=e.message;if(e.auth)clSessionPerdue();if(!CL.ready)throw e}
 finally{CL.pulling=false}
 if(n&&CL.ready){index();clCache();clRafraichir()}else if(CL.ready)clEtat();
 return n}
function clRafraichir(){const a=typeof document!=='undefined'&&document.activeElement,saisie=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.id!=='profil';
 if($('#layer').innerHTML||$('#layer2').innerHTML||saisie){CL.aRendre=true;return clEtat()}CL.aRendre=false;render()}

/* --- État de la synchronisation, affiché dans la barre latérale --- */
function clEtatTexte(){if(CL.err)return['crit','Erreur : '+CL.err];if(CL.horsLigne)return['warn',`Hors ligne${CL.pend.size?` — ${CL.pend.size} modification(s) en attente`:''}`];
 if(CL.busy||CL.pend.size)return['info',`Enregistrement… (${CL.pend.size})`];return['ok','Synchronisé']}
function clEtat(){const e=typeof document!=='undefined'&&document.getElementById('cl_etat');if(!e)return;const[c,t]=clEtatTexte();e.className='cl-etat '+c;e.textContent=t}
function clWho(){const w=$('#side .who');if(!w||!CL.profil)return;
 w.innerHTML=`<span>${esc(CL.profil.nom)}</span><span style="opacity:.8">${esc(ROLES[CL.profil.role].nom)}${CL.profil.agentId&&ag(CL.profil.agentId)?' — '+esc(nomA(ag(CL.profil.agentId))):''}</span>
 ${CL.orgs.length>1?`<select data-chg="clOrg" aria-label="Organisation">${opt(CL.orgs,CL.org,o=>[o.id,o.nom])}</select>`:''}
 <span id="cl_etat" class="cl-etat"></span><button class="btn g s" data-act="clLogout" style="background:transparent;color:#fff;border-color:#2c5788">Se déconnecter</button>`;clEtat()}

/* --- Écrans de connexion et de démarrage --- */
function clEcran(html){$('#layer').innerHTML=`<div class="cl-ecran"><div class="card cl-box"><div class="brand" style="margin-bottom:14px"><div class="logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4L19 7"/></svg></div><div><b style="color:var(--bleu-fonce)">SENHOP RH</b><div class="sub">Gestion des ressources humaines</div></div></div>${html}</div></div>`}
function clLoginEcran(msg='',email){CL.ready=false;clEcran(`<h2 style="margin-bottom:12px">Connexion</h2>${msg?`<div class="demo" style="margin-bottom:12px">${esc(msg)}</div>`:''}
 <form id="cl_form" style="display:flex;flex-direction:column;gap:12px"><label class="field">Adresse e-mail<input id="cl_email" type="email" autocomplete="username" required value="${esc(email||lsGet('rhospi.email')||'')}"></label>
 <label class="field">Mot de passe<input id="cl_mdp" type="password" autocomplete="current-password" required></label><button class="btn" type="submit" id="cl_ok">Se connecter</button>
 <div class="sub">Les comptes sont créés par la direction ou le service des ressources humaines.</div></form>`);
 const f=document.getElementById('cl_form');f.addEventListener('submit',async ev=>{ev.preventDefault();const b=document.getElementById('cl_ok');b.disabled=true;b.textContent='Connexion…';
  try{const em=val('cl_email').trim();await clAuth({email:em,password:val('cl_mdp')},'password');lsSet('rhospi.email',em);await clDemarrer()}
  catch(e){clLoginEcran(e.reseau?'Pas de connexion au serveur. Vérifiez la connexion internet.':e.message,val('cl_email').trim())}});
 setTimeout(()=>{const i=document.getElementById(email||lsGet('rhospi.email')?'cl_mdp':'cl_email');if(i)i.focus()},50)}
function clSessionPerdue(){if(!CL.sess)return;CL.sess=null;lsDel('rhospi.sess');clCacheMaintenant();clLoginEcran('Votre session a expiré : reconnectez-vous. Vos modifications en attente sont conservées.')}
async function clDemarrer(){
 clEcran('<h2>Ouverture…</h2><p class="sub" id="cl_prog">Vérification de vos accès.</p>');
 let ms;try{ms=await clApi('/rest/v1/rh_membres?select=org_id,role,agent_id,nom,rh_orgs(nom)&actif=is.true&user_id=eq.'+CL.sess.uid);lsSet('rhospi.acces.'+CL.sess.uid,JSON.stringify(ms))}
 catch(e){if(e.auth){CL.sess=null;lsDel('rhospi.sess');return clLoginEcran('Votre session a expiré : reconnectez-vous.')}if(!e.reseau)throw e;try{ms=JSON.parse(lsGet('rhospi.acces.'+CL.sess.uid)||'null')}catch(x){}if(!ms)return clEcran(`<p>Pas de connexion au serveur.</p><button class="btn" data-act="clRetry">Réessayer</button>`);CL.horsLigne=true}
 if(!ms.length)return clEcran(`<h2>Aucun accès</h2><p>Votre compte (${esc(CL.sess.email)}) n'est rattaché à aucune organisation. Demandez à la direction ou au service des ressources humaines de vous donner un accès.</p><button class="btn g" data-act="clLogout">Se déconnecter</button>`);
 CL.orgs=ms.map(m=>({id:m.org_id,nom:(m.rh_orgs&&m.rh_orgs.nom)||m.org_id,role:m.role,agentId:m.agent_id,nom2:m.nom}));
 const pref=lsGet('rhospi.org'),me=CL.orgs.find(o=>o.id===pref)||CL.orgs[0];CL.org=me.id;CL.me=me;ORG_ACTIVE=me.id;
 const c=await clCacheLire();DB=c&&c.db?c.db:{};CL.cur=c&&c.cur||null;CL.pend=new Map(c&&c.pend||[]);CL.last=clRows(DB);
 const p=document.getElementById('cl_prog');if(p)p.textContent=c?'Mise à jour des données…':'Premier chargement des données…';
 try{await clPull(n=>{const q=document.getElementById('cl_prog');if(q&&n)q.textContent=`${n.toLocaleString('fr-FR')} enregistrement(s) reçu(s)…`})}
 catch(e){if(!e.reseau||!DB.agents)return clEcran(`<p>${esc(e.reseau?'Pas de connexion au serveur.':e.message)}</p><button class="btn" data-act="clRetry">Réessayer</button> <button class="btn g" data-act="clLogout">Se déconnecter</button>`);CL.horsLigne=true}
 if(!DB.agents||!DB.services)return clVide();
 clLancer()}
function clVide(){if(!CL_GESTION.includes(CL.me.role))return clEcran(`<h2>${esc(CL.me.nom)}</h2><p>Cette organisation n'a pas encore de données. La direction ou le service des ressources humaines doit d'abord les installer.</p><button class="btn g" data-act="clLogout">Se déconnecter</button>`);
 clEcran(`<h2 style="margin-bottom:6px">${esc(CL.me.nom)}</h2><p class="sub" style="margin-top:0">Cette organisation est vide. Comment voulez-vous commencer ?</p>
 <div style="display:flex;flex-direction:column;gap:10px"><label class="btn">Importer une sauvegarde (.json)<input type="file" accept=".json,application/json" data-chg="clImportVide" hidden></label>
 <button class="btn g" data-act="clDebut" data-m="vierge">Organisation vierge (services et listes par défaut)</button><button class="btn g" data-act="clDebut" data-m="demo">Données d'exemple</button></div>
 <p class="sub">La sauvegarde se crée dans l'ancienne version, depuis Paramètres › Sauvegarde des données.</p>`)}
function clLancer(){migrate(DB);index();
 const m=CL.me,a=m.agentId&&ag(m.agentId);
 if(CL_AVEC_AGENT.includes(m.role)&&!a)return clEcran(`<p>Votre compte est relié à un agent qui n'existe pas dans « ${esc(m.nom)} ». Demandez au service des ressources humaines de corriger votre accès.</p><button class="btn g" data-act="clLogout">Se déconnecter</button>`);
 CL.profil={id:'moi',role:m.role,agentId:a?a.id:undefined,nom:m.nom2||CL.sess.email,label:ROLES[m.role].nom};
 const premier=!CL.ready;CL.ready=true;$('#layer').innerHTML='';
 if(premier){init();clDemarrerSuivi()}else{S.profil=CL.profil;render()}
 clDiff();clEtat();clCache();clPush()}
let CL_SUIVI=false;
function clDemarrerSuivi(){if(CL_SUIVI)return;CL_SUIVI=true;
 setInterval(()=>{if(CL.ready&&document.visibilityState==='visible')clPull().then(()=>{if(CL.pend.size)clPush()})},15000);
 document.addEventListener('visibilitychange',()=>{if(!CL.ready)return;if(document.visibilityState==='hidden'){clearTimeout(CL.tPush);clDiff();clCacheMaintenant();clPush()}else clPull()});
 window.addEventListener('online',()=>{if(CL.ready){clPush();clPull()}});
 window.addEventListener('beforeunload',e=>{if(!CL.ready)return;clearTimeout(CL.tPush);clDiff();clCacheMaintenant();if(CL.pend.size){clPush();e.preventDefault();e.returnValue=''}});
 document.addEventListener('click',()=>{if(CL.aRendre&&!$('#layer').innerHTML&&!$('#layer2').innerHTML)setTimeout(()=>{if(CL.aRendre&&!$('#layer').innerHTML)clRafraichir()},300)},true)}

/* --- Comptes d'accès (direction, RH) --- */
async function clMembres(){try{CL.membres=await clApi('/rest/v1/rh_membres?select=user_id,role,agent_id,nom,email,actif,cree_le&org_id=eq.'+encodeURIComponent(CL.org)+'&order=nom')}catch(e){CL.membres=[];toast(e.message,'err')}if(S.page==='params')clRafraichir()}
function clRolesPossibles(){return Object.keys(ROLES).filter(r=>r!=='superadmin'||CL.profil.role==='superadmin')}
function clComptesCarte(){if(!CL||!CL.ready||!CL_GESTION.includes(CL.profil.role))return'';if(CL.membres===null){CL.membres=undefined;clMembres()}
 const L=CL.membres||[];
 return`<div class="card"><div class="head" style="margin-bottom:10px"><h2>Comptes d'accès</h2><span class="sp"></span><span class="sub">Chaque personne se connecte avec son adresse e-mail et son mot de passe. Les comptes n'ont pas besoin de confirmation par e-mail.</span></div>
 ${CL.membres===undefined?'<p class="sub">Chargement…</p>':table(['Nom','Adresse e-mail','Profil','Agent relié','État','Actions'],L.map(m=>`<tr><td><b>${esc(m.nom)}</b></td><td>${esc(m.email||'')}</td><td>${esc((ROLES[m.role]||{}).nom||m.role)}</td><td>${m.agent_id&&ag(m.agent_id)?esc(nomA(ag(m.agent_id))):'—'}</td><td>${m.actif?'<span class="pill ok">actif</span>':'<span class="pill mute">désactivé</span>'}</td>
  <td>${m.user_id===CL.sess.uid?'<span class="sub">vous</span>':(m.role==='superadmin'&&CL.profil.role!=='superadmin')?'—':`<div class="row" style="flex-wrap:nowrap"><button class="btn g s" data-act="clCptEdit" data-id="${m.user_id}">Modifier</button><button class="btn g s" data-act="clCptMdp" data-id="${m.user_id}">Mot de passe</button><button class="btn ${m.actif?'r':'v'} s" data-act="clCptActif" data-id="${m.user_id}">${m.actif?'Désactiver':'Réactiver'}</button></div>`}</td></tr>`),'Aucun compte.')}
 <h3 style="margin:16px 0 6px">Nouveau compte</h3><div class="form"><label class="field">Nom et prénom<input id="cc_nom"></label><label class="field">Adresse e-mail<input id="cc_email" type="email" autocomplete="off"></label><label class="field">Mot de passe (8 caractères minimum)<input id="cc_mdp" type="text" autocomplete="new-password"></label>
 <label class="field">Profil<select id="cc_role">${opt(clRolesPossibles(),'agent',r=>[r,ROLES[r].nom])}</select></label><label class="field">Agent relié (obligatoire pour chef, major et agent)${agPick('cc_ag',DB.agents.filter(a=>a.situation!=='sorti des effectifs'),'')}</label><div class="field"><span>&nbsp;</span><button class="btn" data-act="clCptNew">Créer le compte</button></div></div>
 <div class="sub">Communiquez l'adresse et le mot de passe à la personne. Si l'adresse a déjà un compte (dans une autre application), elle garde son mot de passe actuel.</div></div>`}
function clSauvegardeCarte(){if(!['superadmin','directeur','rh'].includes(S.profil.role))return'';
 return`<div class="card"><div class="head" style="margin-bottom:10px"><h2>Sauvegarde des données</h2></div><div class="row"><button class="btn g s" data-act="clExport">Exporter toutes les données (.json)</button>${S.profil.role==='superadmin'?`<label class="btn r s">Restaurer une sauvegarde<input type="file" accept=".json,application/json" data-chg="clImport" hidden></label>`:''}</div>
 <div class="sub" style="margin-top:8px">${CL?'La sauvegarde contient les données de l\'organisation ouverte. La restauration remplace toutes ses données, pour tous les utilisateurs.':'Exportez ce fichier pour transférer vos données vers la version en ligne : connectez-vous, puis choisissez « Importer une sauvegarde ».'} Les pièces jointes (documents, photos) ne sont pas incluses.</div></div>`}
const paramsAvantCloud=PAGES.params;
PAGES.params=()=>{let h=paramsAvantCloud();if(S.pSvc)return h;if(CL)h=h.replace('Organisations gérées sur cet appareil','Organisations auxquelles vous avez accès').replace(/<button class="btn r s" data-act="orgSuppr"[^>]*>Supprimer<\/button>/g,'');return h+clComptesCarte()+clSauvegardeCarte()};

const clLireJson=f=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.agents)||!Array.isArray(d.services))throw 0;ok(d)}catch(e){ko(new Error('Ce fichier n\'est pas une sauvegarde SENHOP RH valide.'))}};r.onerror=()=>ko(r.error);r.readAsText(f)});
let CL_IMPORT=null;
Object.assign(CHG,{
 clOrg:el=>{lsSet('rhospi.org',el.value);clCacheMaintenant().then(()=>location.reload())},
 clImport:async el=>{const f=el.files[0];if(!f)return;try{CL_IMPORT=await clLireJson(f)}catch(e){return toast(e.message,'err')}
  modal('Restaurer une sauvegarde',`<p>Remplacer <b>toutes</b> les données de « ${esc(DB.etab)} » par celles du fichier « ${esc(f.name)} » (${CL_IMPORT.agents.length} agent(s), ${(CL_IMPORT.pointages||[]).length} pointage(s)) ?${CL?' Le changement s\'applique à tous les utilisateurs.':''}</p>`,`<button class="btn g" data-act="close">Annuler</button><button class="btn r" data-act="clImportOk">Remplacer les données</button>`)},
 clImportVide:async el=>{const f=el.files[0];if(!f)return;try{DB=await clLireJson(f)}catch(e){return toast(e.message,'err')}DB.etab=DB.etab||CL.me.nom;clLancer();toast('Sauvegarde importée. Envoi des données au serveur…','ok')}
});
Object.assign(ACT,{
 clRetry:()=>clDemarrer().catch(e=>clEcran(`<p>${esc(e.message)}</p><button class="btn" data-act="clRetry">Réessayer</button>`)),
 clLogout:async()=>{if(CL.ready){clearTimeout(CL.tPush);clDiff();if(CL.pend.size){await clPush();if(CL.pend.size&&!confirm(`${CL.pend.size} modification(s) n'ont pas encore été envoyées au serveur. Se déconnecter quand même ? Elles seront perdues.`))return}}
  if(CL.sess){try{await clIdbDo('readwrite',x=>x.delete(clCleCache()))}catch(e){}}try{if(CL.sess)await fetch(CL.url+'/auth/v1/logout',{method:'POST',headers:{apikey:CL.key,Authorization:'Bearer '+CL.sess.at}})}catch(e){}
  lsDel('rhospi.sess');location.reload()},
 clDebut:d=>{DB=d.m==='demo'?seed(new Date()):orgVierge(CL.me.nom);DB.etab=CL.me.nom;clLancer();toast(d.m==='demo'?'Données d\'exemple installées.':'Organisation prête : complétez ses services et ses agents.','ok')},
 clExport:()=>{clRows(DB);telecharger(`SENHOP_RH_sauvegarde_${(DB.etab||'').replace(/[^A-Za-z0-9]+/g,'_')}_${today()}.json`,new Blob([JSON.stringify(DB)],{type:'application/json'}))},
 clImportOk:()=>{if(!CL_IMPORT)return closeModal();DB=CL_IMPORT;CL_IMPORT=null;migrate(DB);save();closeModal();if(typeof S!=='undefined'){S.profil=profils()[0];S.page='params'}render();toast('Données restaurées.','ok')},
 clCptNew:async()=>{const role=val('cc_role'),agentId=pickId('cc_ag'),b={nom:val('cc_nom').trim(),email:val('cc_email').trim(),password:val('cc_mdp'),role,agent_id:agentId||null};
  if(!b.nom||!b.email)return toast('Indiquez le nom et l\'adresse e-mail.','err');if(CL_AVEC_AGENT.includes(role)&&!agentId)return toast('Choisissez l\'agent relié à ce compte.','err');
  try{const r=await clFn('creer',b);if(!r.ok)return toast(r.error,'err');toast(r.existant?`Accès ajouté pour ${b.email} : cette adresse avait déjà un compte, son mot de passe actuel reste valable.`:`Compte créé pour ${b.email}.`,'ok');audit('Compte d\'accès créé',`${b.nom} — ${ROLES[role].nom}`);save();clMembres()}catch(e){toast(e.message,'err')}},
 clCptEdit:d=>{const m=(CL.membres||[]).find(x=>x.user_id===d.id);if(!m)return;
  modal(`Modifier l'accès — ${m.nom}`,`<div class="form"><label class="field">Nom et prénom<input id="ce_nom" value="${esc(m.nom)}"></label><label class="field">Profil<select id="ce_role">${opt(clRolesPossibles(),m.role,r=>[r,ROLES[r].nom])}</select></label><label class="field">Agent relié${agPick('ce_ag',DB.agents,m.agent_id||'')}</label></div>`,`<button class="btn g" data-act="close">Annuler</button><button class="btn" data-act="clCptEditOk" data-id="${m.user_id}">Enregistrer</button>`)},
